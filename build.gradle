plugins {
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.2'
    id 'io.github.0ffz.github-packages' version '[1,2)'
    //id 'org.spongepowered.mixin' version '[0.7,0.8.7)'
}

version = "${project.mc_version}-${project.mod_version}"
group = "org.razordevs.${mod_id}"

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
    configureEach {
        workingDirectory project.file('run')

        systemProperty 'forge.logging.markers', 'REGISTRIES'

        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        workingDirectory project.file('run')
        systemProperty 'mixin.env.remapRefMap', 'true'
        systemProperty 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        workingDirectory project.file('run-data')
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = "https://maven.theillusivec4.top/" }
    maven { url = "https://www.cursemaven.com" }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://modmaven.dev" }

    maven { url = "https://packages.aether-mod.net/The-Aether" }

    flatDir {
        dir 'libs'
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neoforge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.3.2"))

    // Aether
    //implementation ("com.aetherteam.nitrogen:nitrogen_internals:${project.nitrogen_version}")
    implementation ("com.aetherteam.cumulus:cumulus_menus:${project.cumulus_version}")
    implementation ("top.theillusivec4.curios:curios-forge:${project.curios_version}")
    implementation ("com.aetherteam.aether:aether:${project.aether_version}")

    //Deep Aether
    implementation ("curse.maven:deep-aether-852465:${project.deep_aether_version}")
    implementation ("com.github.glitchfiend:TerraBlender-forge:${project.terrablender_version}")

    // Quark
    implementation ("curse.maven:quark-243121:${quark_version}")
    implementation ("curse.maven:zeta-968868:${zeta_version}")
    //implementation ("curse.maven:quark-oddities-301051:3575623")

    // Extra
    compileOnly ("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    compileOnly ("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    runtimeOnly ("mezz.jei:jei-${mc_version}-forge:${jei_version}")
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mc_version              : mc_version,
            neo_version             : neoforge_version,
            neoforge_version_range  : neoforge_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

processResources {
    exclude '.cache/'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}