modLoader="javafml"
loaderVersion="[47,)"
license = "${mod_license}"
issueTrackerURL="https://github.com/RazorDevs/Ascended-Quark/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
A small mod that aims to bring compatibility between Quark and the Aether mod! (And Addons too!)
'''
logoFile="${mod_id}.png"
credits="A special thanks goes to the creators behind Quark and the Aether mods!"

[[dependencies.${mod_id}]]
modId="neoforge"
mandatory=true
versionRange="[${neoforge_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[1.21.1]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="aether"
mandatory=true
versionRange="[1.5.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="quark"
mandatory=true
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="terrablender"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="aeroblender"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="deep_aether"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
